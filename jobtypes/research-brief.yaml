# Research Brief Job Type Configuration

This YAML file defines the research brief agent roster and configuration.

defaults:
  coding_agent: pi
  model: google/gemini-3.6-flash
  thinking: medium
  tools:
    - read
    - grep
    - find
    - ls
    - bash
    - write
    - subagent_create
    - subagent_continue
    - subagent_list
    - subagent_remove
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  data_dir: adws/adw_data

agents:
  - name: interviewer
    model: google/gemini-3.6-flash
    thinking: medium
    purpose: Conduct structured interviews to gather requirements and specifications.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/interviewer/system.md
      user: adws/adw_data/prompt_engineering/interviewer/user.md
    writes:
      - inputs/
    tools:
      - read
      - bash
      - write
  - name: researcher
    model: google/gemini-3.6-flash
    thinking: medium
    purpose: Conduct research on the specified topic and gather citations and findings.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/researcher/system.md
      user: adws/adw_data/prompt_engineering/researcher/user.md
    writes:
      - evidence/
    tools:
      - read
      - bash
      - write
  - name: planner
    model: google/gemini-3.6-flash
    thinking: high
    color: "#a78bfa"
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    writes:
      - specs/
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create
      - subagent_continue
      - subagent_list
      - subagent_remove
  - name: builder
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    writes:
      - outputs/
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write
  - name: reviewer
    model: openai/gpt-5.6-terra
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write